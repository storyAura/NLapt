[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlapt"
version = "0.2.0"
description = "Natural Language Annotation Processing Tools - edit, batch-modify and translate natural-language image captions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
llm = ["httpx"]
images = ["Pillow"]
gui = ["PySide6"]
local = ["onnxruntime", "numpy"]  # Florence-2 ONNX engine (nlapt.local.florence)
dev = ["pytest", "pytest-cov", "numpy"]

[project.gui-scripts]
nlapt-gui = "nlapt_gui.__main__:main"

[tool.setuptools.packages.find]
include = ["nlapt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
